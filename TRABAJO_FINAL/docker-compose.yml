version: '3.8' 

services:
  mongodb:
    image: mongo:6.0 
    container_name: c2_tactico_mongo 
    restart: always 
    ports:
      - "27017:27017" 
    volumes:
      - mongodb_data:/data/db 

  redis:
    image: redis:7.0-alpine 
    container_name: c2_tactico_redis
    restart: always
    ports:
      - "6379:6379" 

volumes:
  mongodb_data: 
